name: "Khanh GitOps CI"

on:
  pull_request:
    branches:
      - develop
      - main
    paths:
      - ".github/workflows/khanh-*.yml"
      - "bootstrap/**"
      - "environments/**"
      - "lambda_src/**"
      - "modules/**"
      - "scripts/**"
      - ".terraform-version"
      - ".tflint.hcl"
      - "Makefile"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    name: "Validate Terraform and Lambda"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.6"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Lambda test dependencies
        working-directory: lambda_src
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Package Lambda zips
        shell: pwsh
        run: ./scripts/package-lambdas.ps1

      - name: Terraform format check
        run: terraform fmt -check -recursive

      - name: Terraform init and validate without backend
        run: |
          set -euo pipefail
          for root in bootstrap environments/sandbox environments/staging environments/prod; do
            echo "Validating ${root}"
            terraform -chdir="${root}" init -backend=false
            terraform -chdir="${root}" validate
          done

      - name: Lambda unit tests
        working-directory: lambda_src
        run: python -m pytest

      - name: Install TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.53.0

      - name: TFLint recursive scan
        run: |
          tflint --init
          tflint --recursive

      - name: Trivy config scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: config
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"

      - name: Install Checkov
        run: pip install checkov==3.2.524

      - name: Checkov Terraform scan
        run: checkov -d . --framework terraform
