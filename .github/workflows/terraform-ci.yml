name: "Terraform CI"

on:
  pull_request:
    branches:
      - main
      - develop

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  validate:
    name: "Lints & Code Quality Tests"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        working-directory: lambda_src
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Python unit tests
        working-directory: lambda_src
        run: python -m pytest

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.6"

      - name: Terraform Fmt Check
        run: terraform fmt -check -recursive

      - name: Initialize and Validate roots
        run: |
          for root in bootstrap environments/sandbox environments/staging environments/prod; do
            echo "Validating root: $root"
            terraform -chdir=$root init -backend=false
            terraform -chdir=$root validate
          done

  plan:
    name: "Generate Terraform Plans"
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.6"

